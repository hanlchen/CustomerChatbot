<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CustomerChatbot - Chat Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .chat-container {
            width: 100%;
            max-width: 600px;
            height: 90vh;
            max-height: 800px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(0, 0, 0, 0.1);
        }

        .chat-header h1 {
            font-size: 18px;
            font-weight: 600;
        }

        .chat-header-info {
            font-size: 12px;
            opacity: 0.9;
        }

        .new-chat-btn {
            background: rgba(255, 255, 255, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.4);
            color: white;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.2s ease;
        }

        .new-chat-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .messages-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .message {
            /* column: the bubble and its suggested actions stack vertically.
               As a row, the actions block was stretched to full bubble height
               and pushed off to the side. */
            display: flex;
            flex-direction: column;
            gap: 6px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .message.customer {
            align-items: flex-end;
        }

        .message.bot {
            align-items: flex-start;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 12px;
            word-wrap: break-word;
            overflow-wrap: anywhere;
            /* Bot replies are multi-line (order lists, policies) -- without
               this every newline collapsed into one run-on line. */
            white-space: pre-wrap;
            font-size: 14px;
            line-height: 1.5;
        }

        .message-content strong {
            font-weight: 600;
        }

        .message.customer .message-content {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-bottom-right-radius: 4px;
        }

        .message.bot .message-content {
            background: white;
            color: #333;
            border: 1px solid #e0e0e0;
            border-bottom-left-radius: 4px;
        }

        .message-meta {
            font-size: 11px;
            opacity: 0.6;
            padding: 0 8px;
            align-self: flex-end;
        }

        .suggested-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            max-width: 85%;
        }

        .action-btn {
            background: #e8eaf6;
            border: 1px solid #667eea;
            color: #667eea;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-family: inherit;
            line-height: 1.4;
            white-space: nowrap;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .action-btn:hover {
            background: #667eea;
            color: white;
        }

        .input-container {
            padding: 16px;
            background: white;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 8px;
        }

        .input-wrapper {
            flex: 1;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .input-field {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #e0e0e0;
            border-radius: 24px;
            font-size: 14px;
            font-family: inherit;
            outline: none;
            transition: all 0.2s ease;
        }

        .input-field:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-field::placeholder {
            color: #999;
        }

        .send-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            transition: all 0.2s ease;
        }

        .send-btn:hover:not(:disabled) {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        .send-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #999;
            padding: 12px;
        }

        .elapsed {
            font-size: 11px;
            opacity: .55;
            font-variant-numeric: tabular-nums;
            margin-left: 2px;
        }

        .loading-dots {
            display: inline-flex;
            gap: 4px;
        }

        .loading-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #667eea;
            animation: bounce 1.4s infinite;
        }

        .loading-dot:nth-child(2) {
            animation-delay: 0.2s;
        }

        .loading-dot:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes bounce {
            0%, 80%, 100% {
                transform: translateY(0);
                opacity: 0.7;
            }
            40% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        .welcome-message {
            text-align: center;
            padding: 40px 20px;
            color: #999;
        }

        .welcome-message h2 {
            color: #333;
            margin-bottom: 10px;
        }

        .welcome-message p {
            font-size: 14px;
            line-height: 1.6;
        }

        .error-message {
            background: #ffebee;
            border-left: 4px solid #f44336;
            color: #c62828;
            padding: 12px 16px;
            border-radius: 4px;
            margin: 0 16px;
            font-size: 13px;
        }

        .success-message {
            background: #e8f5e9;
            border-left: 4px solid #4caf50;
            color: #2e7d32;
            padding: 12px 16px;
            border-radius: 4px;
            margin: 0 16px;
            font-size: 13px;
        }

        .engine-badge {
            display: inline-flex;
            align-items: center;
            gap: 5px;
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid rgba(255, 255, 255, 0.35);
            padding: 3px 9px;
            border-radius: 20px;
            font-size: 11px;
            margin-top: 5px;
            white-space: nowrap;
        }

        .engine-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #7ee2b8;   /* llm */
            flex: none;
        }

        .engine-dot.rules { background: #ffd479; }   /* degraded / no model */
        .engine-dot.offline { background: #ff8a80; }

        .intent-badge {
            /* block + fit-content so the badge sits on its own line instead of
               butting up against the last line of pre-wrap text */
            display: block;
            width: fit-content;
            background: #f3f3f3;
            color: #666;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            margin-top: 8px;
            margin-left: 0;
        }

        .timestamp {
            display: block;
        }

        .timestamp {
            font-size: 11px;
            opacity: 0.5;
            margin-top: 4px;
        }

        @media (max-width: 600px) {
            .chat-container {
                max-height: 100vh;
                border-radius: 0;
            }

            .message-content {
                max-width: 85%;
            }

            .chat-header h1 {
                font-size: 16px;
            }
        }

        .scroll-to-bottom {
            scroll-behavior: smooth;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div>
                <h1>🤖 CustomerChatbot</h1>
                <div class="chat-header-info" id="sessionInfo">Session: Loading...</div>
                <div class="engine-badge" id="engineBadge" title="Which engine answered">
                    <span class="engine-dot" id="engineDot"></span>
                    <span id="engineLabel">checking…</span>
                </div>
            </div>
            <button class="new-chat-btn" onclick="startNewChat()">New Chat</button>
        </div>

        <div class="messages-container" id="messagesContainer">
            <div class="welcome-message">
                <h2>Welcome to CustomerChatbot</h2>
                <p>Hi! I'm here to help with order tracking, returns, shipping, and more. How can I assist you today?</p>
            </div>
        </div>

        <div class="input-container">
            <div class="input-wrapper">
                <input
                    type="text"
                    class="input-field"
                    id="messageInput"
                    placeholder="Type your message here..."
                    onkeypress="handleKeyPress(event)"
                />
                <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
            </div>
        </div>
    </div>

    <script>
        // State management
        let currentSessionId = null;
        let isLoading = false;
        const messagesContainer = document.getElementById('messagesContainer');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const sessionInfo = document.getElementById('sessionInfo');

        // API Configuration
        // Same origin when served by the API (e.g. http://localhost:8000/ui).
        // Falls back to localhost:8000 when the file is opened straight off
        // disk, where window.location.origin is "null".
        const API_URL = window.location.protocol.startsWith('http')
            ? `${window.location.origin}/api/chat`
            : 'http://localhost:8000/api/chat';

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', () => {
            createNewSession();
            refreshEngineBadge();
        });

        // Ask the server which engine and model are live.
        async function refreshEngineBadge() {
            const dot = document.getElementById('engineDot');
            const label = document.getElementById('engineLabel');
            try {
                const origin = API_URL.replace(/\/api\/chat$/, '');
                const response = await fetch(`${origin}/status`);
                if (!response.ok) throw new Error(response.status);
                const engine = (await response.json()).engine || {};

                if (engine.reasoning === 'llm') {
                    dot.className = 'engine-dot';
                    const where = engine.provider === 'anthropic' ? 'hosted' : 'local';
                    label.textContent = `${shortModel(engine.model)} · ${where}`;
                    label.title = engine.reasoning_detail || '';
                } else {
                    dot.className = 'engine-dot rules';
                    label.textContent = 'no model · unavailable';
                }
            } catch (error) {
                dot.className = 'engine-dot offline';
                label.textContent = 'server offline';
            }
        }

        // "mlx-community/Qwen3-8B-4bit" -> "Qwen3-8B-4bit"
        function shortModel(name) {
            if (!name) return 'model';
            const tail = String(name).split('/').pop();
            return tail.length > 28 ? tail.slice(0, 27) + '…' : tail;
        }

        // Keep the badge honest: a turn the model could not answer shows as
        // unavailable rather than as the model that did not answer it.
        function noteTurnEngine(data) {
            const dot = document.getElementById('engineDot');
            const label = document.getElementById('engineLabel');
            if (!data || !data.engine) return;
            if (data.engine === 'llm' && data.model) {
                dot.className = 'engine-dot';
                const where = data.provider === 'anthropic' ? 'hosted' : 'local';
                label.textContent = `${shortModel(data.model)} · ${where}`;
            } else {
                dot.className = 'engine-dot rules';
                label.textContent = `no model · ${data.engine}`;
            }
        }

        // Give up after this long rather than spinning forever. Slightly
        // above the server's own model timeout so the server's error wins.
        const REQUEST_TIMEOUT_MS = 150000;

        // POST a message to the server, returning the raw response
        function postMessage(message) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), REQUEST_TIMEOUT_MS);
            return fetch(`${API_URL}/message`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    session_id: currentSessionId,
                    message: message
                }),
                signal: controller.signal
            }).finally(() => clearTimeout(timer));
        }

        // Pull a human-readable reason out of an error response
        async function describeError(response) {
            try {
                const body = await response.json();
                if (body.error) return body.error;
                if (Array.isArray(body.detail) && body.detail.length) {
                    return body.detail[0].msg || JSON.stringify(body.detail[0]);
                }
                if (body.detail) return body.detail;
            } catch (e) {
                // response had no JSON body
            }
            return `server responded ${response.status}`;
        }

        // Request a session id without touching the transcript on screen
        async function createSessionId() {
            const response = await fetch(`${API_URL}/session`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({})
            });
            if (!response.ok) throw new Error(await describeError(response));
            const data = await response.json();
            currentSessionId = data.session_id;
            sessionInfo.textContent = `Session: ${currentSessionId}`;
            return currentSessionId;
        }

        // Server sends UTC. A bare ISO string with no zone is read as LOCAL
        // time by Date(), which put bot replies hours away from user messages.
        function parseTimestamp(value) {
            if (!value) return new Date();
            const hasZone = /(?:Z|[+-]\d{2}:?\d{2})$/.test(value);
            const parsed = new Date(hasZone ? value : value + 'Z');
            return isNaN(parsed.getTime()) ? new Date() : parsed;
        }

        // Create a new chat session
        async function createNewSession() {
            try {
                await createSessionId();

                // Clear messages and show welcome
                messagesContainer.innerHTML = `
                    <div class="welcome-message">
                        <h2>Welcome to CustomerChatbot</h2>
                        <p>Hi! I'm here to help with order tracking, returns, shipping, and more. How can I assist you today?</p>
                    </div>
                `;

                messageInput.focus();
            } catch (error) {
                console.error('Error creating session:', error);
                currentSessionId = null;
                sessionInfo.textContent = 'Session: offline';
                showError(
                    `Couldn't start a chat session (${error.message}). ` +
                    'Make sure the server is running: python app.py'
                );
            }
        }

        // Start new chat
        function startNewChat() {
            if (confirm('Start a new chat? Current conversation will be archived.')) {
                createNewSession();
            }
        }

        // Handle enter key in input
        function handleKeyPress(event) {
            if (event.key === 'Enter' && !isLoading) {
                sendMessage();
            }
        }

        // Send message
        async function sendMessage(messageText) {
            // Only honour a real string, so an accidental Event argument
            // doesn't blow up on .trim()
            const source = (typeof messageText === 'string' && messageText)
                ? messageText
                : messageInput.value;
            const message = source.trim();
            if (!message || isLoading) return;

            // No session yet (server was down at page load) -- try once more
            // rather than silently swallowing the message.
            if (!currentSessionId) {
                try {
                    await createSessionId();
                } catch (error) {
                    showError(
                        `Couldn't reach the server (${error.message}). ` +
                        'Start it with: python app.py'
                    );
                    return;
                }
            }

            // Clear input
            messageInput.value = '';
            messageInput.focus();

            // Drop the welcome placeholder before the first real message
            removeWelcomeMessage();

            // Add user message to UI
            addMessageToUI('customer', message);

            // Show loading indicator
            isLoading = true;
            sendBtn.disabled = true;
            showLoadingIndicator();

            try {
                // Remove welcome message if it exists
                removeWelcomeMessage();

                // Send message to server
                let response = await postMessage(message);

                // Sessions live in server memory, so a restarted server makes
                // this tab's session id stale. Recover silently instead of
                // failing every message until the user clicks "New Chat".
                if (response.status === 404) {
                    await createSessionId();
                    if (currentSessionId) {
                        response = await postMessage(message);
                    }
                }

                if (!response.ok) {
                    throw new Error(await describeError(response));
                }

                const data = await response.json();

                // Remove loading indicator
                removeLoadingIndicator();

                // Reflect which engine actually answered this turn
                noteTurnEngine(data);

                // Add bot response
                if (data.response) {
                    addMessageToUI('bot', data.response, data.intent, data.suggested_actions, data.timestamp);
                }

                // Internal tool names ("search_policy") are not customer-facing,
                // and the banners stacked up over the conversation. Log only.
                if (data.actions_taken && data.actions_taken.length > 0) {
                    console.debug('[chatbot] tools used:', data.actions_taken.join(', '));
                }
            } catch (error) {
                console.error('Error sending message:', error);
                removeLoadingIndicator();
                // Surface the real reason -- "Please try again" hid whether the
                // server was down, the session was gone, or the input was bad.
                if (error && error.name === 'AbortError') {
                    showError(
                        'The model took too long to answer. It may still be ' +
                        'loading, or the machine is under heavy load — check ' +
                        'the vLLM terminal.'
                    );
                } else {
                    showError(
                        error && error.message
                            ? `Couldn't send message: ${error.message}`
                            : "Couldn't reach the server. Is it running?"
                    );
                }
            } finally {
                isLoading = false;
                sendBtn.disabled = false;
            }
        }

        // Add message to UI
        function addMessageToUI(role, content, intent = null, actions = [], timestamp = null) {
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${role}`;

            const time = parseTimestamp(timestamp).toLocaleTimeString();

            let html = `
                <div class="message-content">${formatMessage(content)}`;

            if (intent) {
                html += `<div class="intent-badge">${escapeHtml(intent)}</div>`;
            }

            // No stray whitespace inside .message-content -- pre-wrap would
            // render template indentation as blank lines.
            html += `<div class="timestamp">${time}</div></div>`;

            if (role === 'bot' && actions && actions.length > 0) {
                html += `<div class="suggested-actions">`;
                actions.forEach(action => {
                    // data-action + delegated listener: inline onclick broke on
                    // any label containing a quote or apostrophe.
                    html += `<button class="action-btn" data-action="${escapeAttr(action)}">${escapeHtml(action)}</button>`;
                });
                html += `</div>`;
            }

            messageDiv.innerHTML = html;
            messagesContainer.appendChild(messageDiv);

            // Scroll to bottom
            scrollToBottom();
        }

        // Show loading indicator, with a live timer. A local model can take
        // 20-30s per reply; a spinner with no elapsed time is indistinguishable
        // from a hang.
        let loadingTimer = null;

        function showLoadingIndicator() {
            const loadingDiv = document.createElement('div');
            loadingDiv.className = 'message bot';
            loadingDiv.id = 'loadingIndicator';
            loadingDiv.innerHTML = `
                <div class="message-content" style="background: transparent; border: none;">
                    <div class="loading">
                        <span id="loadingLabel">Thinking</span>
                        <div class="loading-dots">
                            <div class="loading-dot"></div>
                            <div class="loading-dot"></div>
                            <div class="loading-dot"></div>
                        </div>
                        <span id="loadingElapsed" class="elapsed"></span>
                    </div>
                </div>
            `;
            messagesContainer.appendChild(loadingDiv);
            scrollToBottom();

            const startedAt = Date.now();
            loadingTimer = setInterval(() => {
                const seconds = Math.floor((Date.now() - startedAt) / 1000);
                const elapsed = document.getElementById('loadingElapsed');
                const label = document.getElementById('loadingLabel');
                if (!elapsed) return;
                elapsed.textContent = `${seconds}s`;
                // Reassure rather than alarm: a local model really is this slow.
                if (label && seconds === 20) {
                    label.textContent = 'Still working — local models take a while';
                }
                if (label && seconds === 60) {
                    label.textContent = 'This is unusually slow';
                }
            }, 1000);
        }

        // Remove loading indicator
        function removeLoadingIndicator() {
            if (loadingTimer) { clearInterval(loadingTimer); loadingTimer = null; }
            const loading = document.getElementById('loadingIndicator');
            if (loading) loading.remove();
        }

        // Remove welcome message
        function removeWelcomeMessage() {
            const welcome = messagesContainer.querySelector('.welcome-message');
            if (welcome) welcome.remove();
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.createElement('div');
            errorDiv.className = 'error-message';
            errorDiv.textContent = message;
            messagesContainer.parentElement.insertBefore(errorDiv, messagesContainer.nextSibling);
            setTimeout(() => errorDiv.remove(), 5000);
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.createElement('div');
            successDiv.className = 'success-message';
            successDiv.textContent = message;
            messagesContainer.parentElement.insertBefore(successDiv, messagesContainer.nextSibling);
            setTimeout(() => successDiv.remove(), 4000);
        }

        // Scroll to bottom
        function scrollToBottom() {
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        // Escape HTML special characters
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text == null ? '' : String(text);
            return div.innerHTML;
        }

        // Escape for use inside a double-quoted HTML attribute
        function escapeAttr(text) {
            return escapeHtml(text).replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        }

        // Escape first, then render **bold** so policy text isn't full of asterisks
        function formatMessage(text) {
            return escapeHtml(text).replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        }

        // Delegated click handling for suggested-action buttons
        messagesContainer.addEventListener('click', (event) => {
            const btn = event.target.closest('.action-btn');
            if (btn && !isLoading) {
                sendMessage(btn.dataset.action);
            }
        });
    </script>
</body>
</html>
