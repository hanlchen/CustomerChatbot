[pytest]
# The application modules live at the repo root, and the tests import them by
# plain name (`import llm_agent`). This puts the root on sys.path so that works
# from tests/ without a conftest or an installed package.
pythonpath = .

# A directory, not a list of files. It used to be an explicit list, because it
# used to say `testpaths = tests` while tests/ held a stale copy of a retired
# prototype -- bare `pytest` aborted during collection and none of the real
# tests ran. Naming every file fixed that, and introduced its own failure: a
# NEW test file was silently not run until someone remembered to add it here,
# which is exactly what happened to test_telemetry.py and its 26 tests.
#
# With one real test directory a directory is the right answer again, and a new
# file in it is collected without anyone doing anything. TestTestsAreActually-
# Collected in tests/test_regression.py guards the original bug: it fails if
# this path stops resolving to a meaningful number of tests.
testpaths = tests

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async tests declare @pytest.mark.asyncio explicitly.
asyncio_mode = strict

norecursedirs = .git __pycache__ .pytest_cache .github _to_delete eval_runs
