[pytest]
pythonpath = .

# Explicit list so a bare `pytest` runs the real suite.
#
# Previously this said `testpaths = tests`, which pointed at a stale copy of
# the retired Streamlit chatbot -- bare `pytest` aborted during collection and
# none of the current test files ran.
#
# test_chatbot.py and test_semantic_rag.py were removed in the cleanup: the
# first tested utils.py, a module nothing in the app imports, and the second
# called sys.exit() at import time, killing the entire pytest process when its
# optional dependencies were absent.
#
# An explicit list means a NEW test file is silently not run until it is added
# here -- which happened to test_telemetry.py, 26 tests that passed when named
# directly and did not exist as far as `pytest` was concerned.
# TestEveryTestFileIsCollected in test_regression.py now fails if this list
# and the directory disagree.
testpaths =
    test_production.py
    test_chat.py
    test_regression.py
    test_retrieval.py
    test_security.py
    test_telemetry.py
    test_eval_metrics.py
    test_customer_db.py

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Async tests declare @pytest.mark.asyncio explicitly.
asyncio_mode = strict

norecursedirs = tests .git __pycache__ .pytest_cache policies .github _to_delete
